# Accelerator specifications used in sizing arithmetic. These are datasheet peaks; the book
# applies an explicit efficiency factor wherever it uses them, because no workload reaches peak.
# Compute figures are dense (no structured sparsity).

[gpu.H100]
memory_gb = 80
bandwidth_tb_s = 3.35
bf16_tflops = 989
fp8_tflops = 1979
source = "NVIDIA H100 Tensor Core GPU datasheet, SXM5 form factor (https://www.nvidia.com/en-us/data-center/h100/). The page lists 1,979 BF16 and 3,958 FP8 TFLOPS with sparsity; these are the dense halves. No FP4 format is listed."
checked = "2026-11-04"

[gpu.H200]
memory_gb = 141
bandwidth_tb_s = 4.8
bf16_tflops = 989
fp8_tflops = 1979
source = "NVIDIA H200 Tensor Core GPU datasheet, SXM form factor"

[gpu.B200]
